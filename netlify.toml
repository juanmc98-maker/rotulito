# Web de Plata Garage en Netlify (en la raíz del dominio) (rotulito.com sigue en GitHub Pages).
# Los commits con "publicar" se suben de uno en uno y separados para que Netlify no los salte.
[build]
  publish = "."
  functions = "netlify/functions"
  # Solo se publica cuando el último cambio lo pide con la palabra "publicar" (cada publicación gasta créditos)
  ignore = "git log -1 --pretty=%B | grep -qi 'publicar' && exit 1 || exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

